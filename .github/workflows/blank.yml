name: Sudoku CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Build project
        run: make

      - name: Run serial tests
        run: make test

      - name: Run OpenMP tests
        run: make test-omp

      - name: Run MPI tests
        run: make test-mpi
